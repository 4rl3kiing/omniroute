name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths: ["package.json", "package-lock.json"]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production, high+)
    runs-on: ubuntu-latest
    # On PRs the audit is advisory so an upstream advisory cannot block unrelated work;
    # the weekly scheduled run is the enforcing one.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
